apiVersion: v1
kind: ConfigMap
metadata:
  name: gw-nginx
  namespace: {{NAMESPACE}}
data:
  nginx.conf: |
    user nginx;
    worker_processes  8;
    error_log  /etc/nginx/error.log;
    events {
      worker_connections  102400;
    }
    http {
        # Define a map to generate timestamp at request start
        map $time_iso8601 $nginx_accept_timestamp {
            default $time_iso8601;
        }
        
        log_format  main
        '[GATEWAY]n- '
        '$remote_addr - - '
        '[$time_local] '
        '$nginx_accept_timestamp '
        '$nginx_forward_timestamp '
        '"$request_method '
        '$request_uri" '
        '$status -'
        ' http:/$request_uri.{{NAMESPACE}}.svc.cluster.local';

        access_log  /etc/nginx/access.log main;
        #access_log  /var/log/nginx/access.log main;
        access_log on;

        server {
                listen       80;
                server_name  _;
                location / {
                    # Capture accept timestamp at request start with microsecond precision
                    set $nginx_accept_timestamp_captured $msec;
                    
                    # Set accept timestamp header immediately
                    add_header X-Nginx-Accept-Time $nginx_accept_timestamp_captured always;
                    
                    proxy_read_timeout 5m;
                    proxy_connect_timeout 5m;
                    proxy_send_timeout 5m;
                    resolver {{RESOLVER}};
                    
                    # Capture forward timestamp just before proxy with microsecond precision  
                    set $nginx_forward_timestamp $msec;
                    
                    # Set forward timestamp header
                    add_header X-Nginx-Forward-Time $nginx_forward_timestamp always;
                    
                    proxy_pass http:/$request_uri.{{NAMESPACE}}.svc.cluster.local{{PATH}};
                    proxy_http_version 1.1;
                    
                    # Pass through the timestamp headers to preserve them
                    proxy_pass_header X-Nginx-Accept-Time;
                    proxy_pass_header X-Nginx-Forward-Time;
                }
                location ~* /update$ {
                    # Capture accept timestamp at request start with microsecond precision
                    set $nginx_accept_timestamp_captured $msec;
                    
                    # Set accept timestamp header immediately
                    add_header X-Nginx-Accept-Time $nginx_accept_timestamp_captured always;
                    
                    resolver {{RESOLVER}};
                    rewrite ^(/.*)/update$ /update break;
                    
                    # Capture forward timestamp just before proxy with microsecond precision  
                    set $nginx_forward_timestamp $msec;
                    
                    # Set forward timestamp header
                    add_header X-Nginx-Forward-Time $nginx_forward_timestamp always;
                    
                    proxy_pass http:/$1.{{NAMESPACE}}.svc.cluster.local;
                    proxy_http_version 1.1;
                    
                    # Pass through the timestamp headers to preserve them
                    proxy_pass_header X-Nginx-Accept-Time;
                    proxy_pass_header X-Nginx-Forward-Time;
                }
        }
    }
