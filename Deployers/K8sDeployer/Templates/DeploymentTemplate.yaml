apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: {{SERVICE_NAME}}
  namespace: {{NAMESPACE}}
  labels:
    zone: default
    app: {{SERVICE_NAME}}
    version: "1.0"
  annotations:
    something: something
spec:
  selector:
    matchLabels:
      app: {{SERVICE_NAME}}
  replicas: {{REPLICAS}}
  template:
    metadata:
      labels:
        zone: default
        app: {{SERVICE_NAME}}
        version: "1.0"
        prometheus.io/scrape: 'true'
        qos-group: {{QOS_GROUP}}
        cosched.io/scheduler-name: {{SCHEDULER_IN_COSCHED}}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        qos-group: {{QOS_GROUP}}
        sidecar.istio.io/proxyMemory: "32Mi"        # memory request
        sidecar.istio.io/proxyMemoryLimit: "6Gi"    # memory limit
        sidecar.istio.io/proxyCPU: "50m"            # cpu request
        sidecar.istio.io/proxyCPULimit: "20000m"     # cpu limit
        sidecar.istio.io/userVolume: |
          [
            {"name":"schedsock", "hostPath": {"path":"/var/run/node-scheduler", "type": "DirectoryOrCreate"}},
            { "name":"registry-ca",
              "secret":{ "secretName":"registry-ca" }
            },
            {"name":"cosched-wasm","configMap":{"name":"cosched-wasm"}},
            {"name":"macaw-module","hostPath":{"path":"/opt/macaw","type":"DirectoryOrCreate"}},
            {"name":"macaw-sock","hostPath":{"path":"/var/run/macaw","type":"DirectoryOrCreate"}}
          ]
        sidecar.istio.io/userVolumeMount: |
          [
            {"name": "schedsock", "mountPath":"/var/run/node-scheduler", "readonly":false},
            { "name":"registry-ca",
              "mountPath":"/etc/registry-ca",
              "readonly": true
            },
            {"name":"cosched-wasm","mountPath":"/etc/istio/wasm","readonly":true},
            {"name":"macaw-module","mountPath":"/etc/macaw","readonly":true},
            {"name":"macaw-sock","mountPath":"/var/run/macaw","readonly":false}
          ]
        # The two macaw-* volumes and the MACAW_/ENVOY_DYNAMIC_MODULES_ metadata
        # are INERT unless the macaw EnvoyFilter is also applied. Both host paths
        # are DirectoryOrCreate, so a pod starts whether or not the node agent
        # has run; the env vars name a module nobody loads. They are therefore
        # safe to carry on every cluster, including AWS, which is why they live
        # here rather than in a CloudLab-only fork of this template.
        proxy.istio.io/config: |
          {"proxyMetadata":{"SSL_CERT_DIR":"/etc/ssl/certs:/etc/registry-ca",
                            "ENVOY_DYNAMIC_MODULES_SEARCH_PATH":"/etc/macaw",
                            "MACAW_BOOTSTRAP_SOCKET":"/var/run/macaw/bootstrap.sock",
                            "MACAW_QUEUE_POLICY":"{{MACAW_QUEUE_POLICY}}",
                            "MACAW_SAFETY_TICK_MS":"{{MACAW_SAFETY_TICK_MS}}"},
           "concurrency":{{ENVOY_CONCURRENCY}}}
    spec:
      terminationGracePeriodSeconds : 3
      schedulerName: {{SCHEDULER_NAME}}
      dnsConfig:
        options:
          - name: ndots
            value: {{DNS_NDOTS}}
      {{NODE_AFFINITY}}
      containers:
        - name: {{SERVICE_NAME}}
          image: {{IMAGE}}
          ports:
            - name: http-mubpodport
              containerPort: 8080
          volumeMounts:
            - name: podinfo
              mountPath: /etc/podinfo
            - name: microservice-workmodel
              mountPath: /app/MSConfig
            - name: microservice-internal-services
              mountPath: /app/MSConfig/InternalServiceFunctions
            {{HOST_FILES_MOUNT_PATHS}}
          env:
            - name: APP
              value: {{SERVICE_NAME}}
            - name: ZONE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['zone']
            - name: K8S_APP
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: PN
              value: {{PN}}
            - name: TN
              value: {{TN}}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOGGER_LEVEL
              value: {{LOGGER_LEVEL}}
            - name: SERVICE_POOL_CONNECTIONS
              value: {{SERVICE_POOL_CONNECTIONS}}
            - name: SERVICE_POOL_MAXSIZE
              value: {{SERVICE_POOL_MAXSIZE}}
            - name: SERVICE_POOL_BLOCK
              value: {{SERVICE_POOL_BLOCK}}

          resources: {{RESOURCES}}    
        
        {{SIDECAR}}

      {{POD_ANTIAFFINITY}}

      volumes:
        - name: podinfo
          downwardAPI:
            items:
              - path: "labels"
                fieldRef:
                  fieldPath: metadata.labels
              - path: "annotations"
                fieldRef:
                  fieldPath: metadata.annotations
        - name: microservice-workmodel
          configMap:
            name: workmodel
        - name: microservice-internal-services
          configMap:
            name: internal-services
        {{HOST_FILES_VOLUMES}}
